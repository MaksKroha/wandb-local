<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wandb-local runs</title>
<meta name="color-scheme" content="light dark">
<!--WANDB_EMBED-->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f1f0ec;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #6f6d68;
  --tick: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --border-strong: rgba(11, 11, 11, 0.18);
  --accent: #2a78d6;
  --accent-wash: rgba(42, 120, 214, 0.10);
  --hover: rgba(11, 11, 11, 0.04);
  --diff: rgba(237, 161, 0, 0.12);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --shadow: 0 4px 16px rgba(11, 11, 11, 0.10);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a3a29b; --tick: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255, 255, 255, 0.10); --border-strong: rgba(255, 255, 255, 0.18);
    --accent: #3987e5; --accent-wash: rgba(57, 135, 229, 0.16);
    --hover: rgba(255, 255, 255, 0.05); --diff: rgba(201, 133, 0, 0.16);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a3a29b; --tick: #898781;
  --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255, 255, 255, 0.10); --border-strong: rgba(255, 255, 255, 0.18);
  --accent: #3987e5; --accent-wash: rgba(57, 135, 229, 0.16);
  --hover: rgba(255, 255, 255, 0.05); --diff: rgba(201, 133, 0, 0.16);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  height: 52px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
.brand svg { flex: none; }
.brand small { font-weight: 400; color: var(--muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  border: 0; background: none; padding: 6px 10px; border-radius: 6px; color: var(--ink-2); white-space: nowrap;
}
.tab:hover { background: var(--hover); }
.tab[aria-selected="true"] { background: var(--accent-wash); color: var(--ink); font-weight: 600; }
.top-actions { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.btn {
  border: 1px solid var(--border-strong); background: var(--surface); border-radius: 6px; padding: 4px 10px;
}
.btn:hover { background: var(--hover); }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn.ghost { border-color: transparent; }
.btn[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); }
.icon-btn { border: 0; background: none; padding: 4px; border-radius: 6px; color: var(--ink-2); line-height: 0; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.live { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12px; }
.live input { margin: 0; }
.layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); min-height: calc(100vh - 52px); }
.sidebar {
  border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column;
  position: sticky; top: 52px; height: calc(100vh - 52px);
}
.side-head { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--border); }
.side-head .row { display: flex; gap: 6px; }
.input {
  width: 100%; border: 1px solid var(--border-strong); border-radius: 6px; padding: 5px 8px; background: var(--page);
}
select.input { padding: 4px 6px; }
.run-list { list-style: none; margin: 0; padding: 4px 0; overflow-y: auto; flex: 1; }
.run-item { display: grid; grid-template-columns: 20px 12px minmax(0, 1fr); gap: 4px 8px; align-items: start; padding: 7px 12px; cursor: pointer; }
.run-item:hover { background: var(--hover); }
.run-item.selected { background: var(--accent-wash); }
.run-item input { margin: 3px 0 0; }
.swatch { width: 12px; height: 12px; border-radius: 3px; margin-top: 4px; background: transparent; }
.run-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-meta { grid-column: 3; font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.state { display: inline-flex; align-items: center; gap: 4px; color: var(--ink-2); font-size: 12px; }
.state .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.state-running .dot { background: var(--good); box-shadow: 0 0 0 3px rgba(12, 163, 12, 0.18); }
.state-finished .dot { background: var(--axis); }
.state-failed .dot, .state-killed .dot { background: var(--critical); }
.state-crashed .dot { background: var(--serious); }
.state-unknown .dot, .state-not-imported .dot, .state-disabled .dot { background: transparent; border: 1.5px solid var(--tick); }
.side-foot { padding: 8px 12px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }
main { min-width: 0; padding: 16px 20px 48px; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-bottom: 16px; }
.filters label { display: flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 13px; }
.filters .input { width: auto; }
.filters input[type="range"] { width: 120px; accent-color: var(--accent); }
.filters .grow { flex: 1; min-width: 180px; }
.filters .grow .input { width: 100%; }
.num { font-variant-numeric: tabular-nums; }
.section { margin-bottom: 20px; }
.section-head {
  display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 4px 0 8px;
  font-weight: 600; font-size: 15px; text-align: left;
}
.section-head .count { color: var(--muted); font-weight: 400; font-size: 13px; }
.section-head svg { transition: transform 0.15s; color: var(--muted); }
.section-head[aria-expanded="false"] svg { transform: rotate(-90deg); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 12px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px 8px; min-width: 0; }
.panel.wide { grid-column: 1 / -1; }
.panel-head { display: flex; align-items: center; gap: 6px; min-height: 26px; }
.panel-title { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.panel-title small { color: var(--muted); font-weight: 400; }
.panel-tools { display: flex; gap: 2px; }
.chart { position: relative; height: 210px; margin-top: 4px; touch-action: pan-y; }
.panel.wide .chart { height: 360px; }
.chart canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.chart canvas.overlay { cursor: crosshair; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.legend span b { font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
.key-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; flex: none; }
.empty-chart { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
.data-table-wrap { max-height: 260px; overflow: auto; margin-top: 8px; border-top: 1px solid var(--border); }
.tooltip {
  position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 12px; max-width: 340px; display: none;
}
.tooltip .tt-head { color: var(--muted); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.tooltip .tt-row { display: grid; grid-template-columns: 14px auto minmax(0, 1fr); align-items: center; gap: 6px; }
.tooltip .tt-row strong { font-variant-numeric: tabular-nums; font-weight: 600; }
.tooltip .tt-row span.name { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th, table.t td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.t th { position: sticky; top: 0; background: var(--surface); font-weight: 600; color: var(--ink-2); z-index: 1; }
table.t td.num, table.t th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.diff td { background: var(--diff); }
table.t td.key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--ink-2); word-break: break-all; min-width: 180px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; min-width: 0; }
.card h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h3 small { font-weight: 400; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 16px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; word-break: break-word; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.muted { color: var(--muted); }
.notice { background: var(--surface); border: 1px dashed var(--border-strong); border-radius: 10px; padding: 24px; color: var(--ink-2); }
.notice code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.banner { background: var(--accent-wash); border-radius: 8px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; color: var(--ink-2); }
.err-banner { position: fixed; bottom: 12px; left: 12px; right: 12px; z-index: 60; background: var(--surface); border: 1px solid var(--critical); border-radius: 8px; padding: 10px 12px; font-size: 13px; display: none; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--page); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
.cell-text { white-space: pre-wrap; word-break: break-word; max-height: 9.5em; overflow: hidden; position: relative; cursor: pointer; min-width: 160px; }
.cell-text.long::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.2em; background: linear-gradient(transparent, var(--surface)); }
.cell-text.open { max-height: none; }
.cell-text.open::after { display: none; }
.msg { border-left: 2px solid var(--axis); padding-left: 8px; margin-bottom: 6px; }
.msg .role { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.table-scroll { overflow: auto; max-height: 70vh; border: 1px solid var(--border); border-radius: 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
.toolbar input[type="range"] { flex: 1; min-width: 140px; accent-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { border: 1px solid var(--border-strong); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); }
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.media-grid img, .gallery img { max-width: 100%; border-radius: 6px; background: var(--surface-2); }
.gallery { display: flex; flex-wrap: wrap; gap: 6px; }
.gallery img { max-height: 160px; }
.gallery figure { margin: 0; }
.gallery figcaption { font-size: 12px; color: var(--muted); }
iframe.html-media { width: 100%; height: 320px; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
pre.log { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; overflow: auto; max-height: 75vh; font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; margin: 0; }
.alias { display: inline-block; background: var(--surface-2); border-radius: 4px; padding: 0 6px; margin: 0 4px 2px 0; font-size: 12px; }
.runs-toggle { display: none; }
.pager { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--ink-2); }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; top: 52px; left: 0; bottom: 0; width: min(320px, 88vw); height: auto; z-index: 30; transform: translateX(-100%); transition: transform 0.2s; box-shadow: var(--shadow); }
  body.sidebar-open .sidebar { transform: none; }
  .runs-toggle { display: inline-flex; }
  main { padding: 12px 16px 48px; }
  .brand small, .live span { display: none; }
  .topbar { gap: 8px; padding: 0 12px; }
}
@media (forced-colors: active) {
  .key-line, .swatch, .state .dot { forced-color-adjust: none; }
}
</style>
</head>
<body>
<header class="topbar">
  <button class="icon-btn runs-toggle" id="runsToggle" aria-label="Show runs" title="Runs">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
  </button>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="5" fill="var(--accent)"/><path d="M5 15l3.5-4 3 2.5L17 7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>wandb-local</span><small id="brandSub">runs</small>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="top-actions">
    <label class="live" id="liveWrap" title="Poll for new data every 5 seconds"><input type="checkbox" id="liveToggle" checked><span>Live</span></label>
    <button class="btn small" id="exportBtn" title="Download a self-contained HTML report of the selected runs">Export</button>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Theme: auto"></button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Runs">
    <div class="side-head">
      <input class="input" id="runSearch" type="search" placeholder="Search runs" aria-label="Search runs">
      <div class="row">
        <select class="input" id="projectSelect" aria-label="Project"></select>
      </div>
      <div class="row">
        <button class="btn small" id="selLatest" title="Select the most recent run">Latest</button>
        <button class="btn small" id="selVisible" title="Select up to 8 visible runs">Select visible</button>
        <button class="btn small ghost" id="selNone">Clear</button>
      </div>
    </div>
    <ul class="run-list" id="runList" role="listbox" aria-multiselectable="true"></ul>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <main id="main">
    <div id="banner"></div>
    <div class="filters" id="filters"></div>
    <div id="view"></div>
  </main>
</div>
<div class="tooltip" id="tooltip" role="status" aria-live="polite"></div>
<div class="toast" id="toast"></div>
<div class="err-banner" id="errBanner"></div>
<script>
'use strict';
// ------------------------------------------------------------------ basics --
const ERR = document.getElementById('errBanner');
window.addEventListener('error', (e) => { ERR.style.display = 'block'; ERR.textContent = 'Dashboard error: ' + (e.message || e.error); });
window.addEventListener('unhandledrejection', (e) => { ERR.style.display = 'block'; ERR.textContent = 'Dashboard error: ' + (e.reason && e.reason.message || e.reason); });

const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const svgIcon = (d, size = 16) => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('width', size); s.setAttribute('height', size); s.setAttribute('viewBox', '0 0 16 16'); s.setAttribute('fill', 'none'); s.setAttribute('stroke', 'currentColor'); s.setAttribute('stroke-width', '1.5'); s.setAttribute('stroke-linecap', 'round'); s.setAttribute('stroke-linejoin', 'round'); s.innerHTML = d; return s; };
const ICON = {
  chevron: '<path d="M4 6l4 4 4-4"/>',
  expand: '<path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4"/>',
  table: '<rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M2 7h12M6 7v6"/>',
  reset: '<path d="M3 8a5 5 0 1 0 1.5-3.5M3 2.5v3h3"/>',
  sun: '<circle cx="8" cy="8" r="3"/><path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3 3l1 1M12 12l1 1M3 13l1-1M12 4l1-1"/>',
  moon: '<path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5a5.5 5.5 0 1 0 7 7z"/>',
  auto: '<circle cx="8" cy="8" r="6"/><path d="M8 2a6 6 0 0 0 0 12z" fill="currentColor"/>',
};
const store = {
  get(k, d) { try { const v = localStorage.getItem('wandb-local:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('wandb-local:' + k, JSON.stringify(v)); } catch (e) { /* storage unavailable */ } },
};
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600); }

// --------------------------------------------------------------- data source --
const EMBED = (() => { const el = document.getElementById('wandb-embed'); if (!el) return null; try { return JSON.parse(el.textContent); } catch (e) { console.error(e); return null; } })();
const enc = encodeURIComponent;
async function getJSON(url) { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw new Error(url + ': HTTP ' + r.status); return r.json(); }
const DS = EMBED ? {
  live: false,
  runs: async () => EMBED.runs,
  info: async (k) => EMBED.data[k].info,
  history: async (k, off) => off ? { rows: [], offset: off } : { rows: EMBED.data[k].history || [], offset: 1 },
  events: async (k, off) => off ? { rows: [], offset: off } : { rows: EMBED.data[k].events || [], offset: 1 },
  output: async (k) => EMBED.data[k].output || '',
  fileURL: (k, p) => { const v = ((EMBED.data[k] || {}).files || {})[p]; return typeof v === 'string' ? v : null; },
  fileJSON: async (k, p) => { const v = ((EMBED.data[k] || {}).files || {})[p]; if (v && typeof v === 'object') return v; throw new Error('This table version is not embedded in the report (re-export with --tables all).'); },
  artifacts: async () => EMBED.artifacts || [],
} : {
  live: true,
  runs: async () => (await getJSON('api/runs')).runs,
  info: (k) => getJSON(`api/run/${enc(k)}/info`),
  history: (k, off) => getJSON(`api/run/${enc(k)}/history?offset=${off || 0}`),
  events: (k, off) => getJSON(`api/run/${enc(k)}/events?offset=${off || 0}`),
  output: async (k) => { const r = await fetch(`api/run/${enc(k)}/output`, { cache: 'no-store' }); return r.text(); },
  fileURL: (k, p) => `api/run/${enc(k)}/file/${String(p).split('/').map(enc).join('/')}`,
  fileJSON: (k, p) => getJSON(`api/run/${enc(k)}/file/${String(p).split('/').map(enc).join('/')}`),
  artifacts: async () => (await getJSON('api/artifacts')).artifacts,
};

    const segs = line.split('\r').filter((s) => s.length); out.push(segs.length ? segs[segs.length - 1] : '');
  }
  return out;
}
async function renderLogs(view) {
  const runs = S.selected;
  if (!S.logRun || !runs.includes(S.logRun)) S.logRun = runs[0];
  if (runs.length > 1) view.append(h('div', { class: 'chips' }, runs.map((k) => h('button', { class: 'chip', 'aria-pressed': String(k === S.logRun), onclick: () => { S.logRun = k; renderView(); } }, h('i', { class: 'swatch', style: { background: runColor(k), margin: 0 } }), (S.byKey.get(k) || {}).name || k))));
  const filt = h('input', { class: 'input', type: 'search', placeholder: 'Filter lines', value: S.logFilter, style: { maxWidth: '320px' }, 'aria-label': 'Filter log lines' });
  const info = h('span', { class: 'muted num' });
  view.append(h('div', { class: 'toolbar' }, filt, info));
  const pre = h('pre', { class: 'log', text: 'Loading…' });
  view.append(pre);
  const text = await DS.output(S.logRun);
  const lines = cleanLog(text || '');
  const draw = () => {
    const q = S.logFilter.toLowerCase();
    const shown = q ? lines.filter((l) => l.toLowerCase().includes(q)) : lines;
    info.textContent = `${shown.length.toLocaleString()} of ${lines.length.toLocaleString()} lines`;
    const atBottom = pre.scrollHeight - pre.scrollTop - pre.clientHeight < 40;
    pre.textContent = shown.join('\n') || '(no console output captured)';
    if (atBottom || !renderLogs._seen) { pre.scrollTop = pre.scrollHeight; renderLogs._seen = true; }
  };
  let ft = 0; filt.addEventListener('input', () => { clearTimeout(ft); ft = setTimeout(() => { S.logFilter = filt.value; draw(); }, 200); });
  draw();
}
async function renderArtifacts(view) {
  const list = await DS.artifacts();
  if (!list.length) { view.append(emptyNotice('No artifacts. They are created by run.log_artifact(), WANDB_LOG_MODEL=end|checkpoint (transformers) or run.log_code().')); return; }
  for (const a of list) {
    const t = h('table', { class: 't' }, h('thead', null, h('tr', null, ['Version', 'Aliases', 'Files', 'Size', 'Created', 'Logged by', 'Location'].map((c) => h('th', { text: c, class: c === 'Files' || c === 'Size' ? 'num' : '' })))));
    const body = h('tbody');
    for (const v of [...a.versions].reverse()) {
      body.append(h('tr', null, h('td', { class: 'mono', text: v.version }), h('td', null, (v.aliases || []).map((x) => h('span', { class: 'alias', text: x }))), h('td', { class: 'num', text: String(v.files) }), h('td', { class: 'num', text: fmtBytes(v.size) }), h('td', { text: v.created_at ? new Date(v.created_at).toLocaleString() : '' }), h('td', { text: v.logged_by ? (v.logged_by.name || v.logged_by.id) : '' }), h('td', { class: 'mono', text: v.dir })));
      if (v.metadata && Object.keys(v.metadata).length) body.append(h('tr', null, h('td'), h('td', { colspan: '6' }, h('details', null, h('summary', { class: 'muted', text: 'metadata' }), h('pre', { class: 'mono', text: JSON.stringify(v.metadata, null, 2) })))));
    }
    t.append(body);
    view.append(h('div', { class: 'card' }, h('h3', null, h('span', { text: `${a.project}/${a.name}` }), h('small', { text: a.type || '' })), h('div', { class: 'table-scroll', style: { maxHeight: '420px' } }, t)));
  }
}
function emptyNotice(text) { return h('div', { class: 'notice', text }); }

// ---------------------------------------------------------------- sidebar --
function filteredRuns() {
  const q = S.runFilter.toLowerCase();
  return S.runs.filter((r) => (!S.project || r.project === S.project) && (!q || `${r.name} ${r.id} ${r.project} ${r.group || ''} ${(r.tags || []).join(' ')}`.toLowerCase().includes(q)));
}
function renderSidebar() {
  const projects = [...new Set(S.runs.map((r) => r.project || 'uncategorized'))].sort();
  const ps = $('#projectSelect');
  ps.replaceChildren(h('option', { value: '', text: `All projects (${projects.length})` }), projects.map((p) => h('option', { value: p, text: p, selected: p === S.project })));
  if (S.project && !projects.includes(S.project)) S.project = '';
  const list = $('#runList'); list.replaceChildren();
  const runs = filteredRuns();
  for (const r of runs) {
    const sel = S.selected.includes(r.key);
    const cb = h('input', { type: 'checkbox', checked: sel, 'aria-label': `Compare ${r.name}`, tabindex: '-1' });
    const li = h('li', { class: 'run-item' + (sel ? ' selected' : ''), role: 'option', 'aria-selected': String(sel), tabindex: '0', title: `${r.id} · ${r.dir}` },
      cb, h('i', { class: 'swatch', style: { background: sel ? runColor(r.key) : 'transparent' } }), h('div', { class: 'run-name', text: r.name || r.id }),
      h('div', { class: 'run-meta' }, stateBadge(r.state), h('span', { text: relTime(r.created_at) }), S.project ? null : h('span', { text: r.project })));
    const toggle = (e) => { if (e) e.preventDefault(); toggleRun(r.key); };
    li.addEventListener('click', toggle);
    li.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') toggle(e); });
    list.append(li);
  }
  if (!runs.length) list.append(h('li', { class: 'muted', style: { padding: '12px' }, text: S.runs.length ? 'No runs match.' : 'No runs found yet.' }));
  $('#sideFoot').textContent = `${S.selected.length} of ${MAX_SEL} max selected · ${S.runs.length} run(s)`;
}
function assignSlot(key) {
  if (S.slots.has(key)) return;
  const used = new Set(S.slots.values());
  for (let i = 0; i < MAX_SEL; i++) if (!used.has(i)) { S.slots.set(key, i); return; }
}
function setSelection(keys) {
  S.selected = keys.slice(0, MAX_SEL);
  for (const k of [...S.slots.keys()]) if (!S.selected.includes(k)) S.slots.delete(k);
  for (const k of S.selected) assignSlot(k);
  store.set('selected', S.selected);
  CSSV = null;
  onSelectionChanged();
}
function toggleRun(key) {
  if (S.selected.includes(key)) setSelection(S.selected.filter((k) => k !== key));
  else if (S.selected.length >= MAX_SEL) toast(`At most ${MAX_SEL} runs can be compared at once.`);
  else setSelection([...S.selected, key]);
}
async function onSelectionChanged() {
  renderSidebar();
  const view = $('#view');
  view.style.opacity = '0.6';
  try { await Promise.all(S.selected.map(loadRun)); } catch (e) { toast('Could not load run: ' + e.message); }
  view.style.opacity = '';
  renderSidebar();
  renderView();
}

// --------------------------------------------------------------- top-level --
function renderTabs() {
  const tabs = $('#tabs'); tabs.replaceChildren();
  for (const [id, label] of TABS) {
    const b = h('button', { class: 'tab', role: 'tab', 'aria-selected': String(id === S.tab), text: label });
    b.addEventListener('click', () => { S.tab = id; store.set('tab', id); renderTabs(); renderView(); });
    tabs.append(b);
  }
}
function renderView() {
  clearPanels();
  renderFilters();
  const view = $('#view'); view.replaceChildren();
  const banner = $('#banner'); banner.replaceChildren();
  if (EMBED) banner.append(h('div', { class: 'banner', text: `Static report generated ${new Date(EMBED.generated_at).toLocaleString()} — ${EMBED.runs.length} run(s) embedded. Run "wandb ui" for the live dashboard.` }));
  if (!S.runs.length) {
    const n = h('div', { class: 'notice' });
    n.append(h('p', { style: { marginTop: 0 }, text: 'No runs found.' }), h('p', null, 'Train with ', h('code', { text: 'report_to="wandb"' }), ' (or call ', h('code', { text: 'wandb.init()' }), '); runs are written to ', h('code', { text: './wandb' }), ' and appear here automatically.'), h('p', { style: { marginBottom: 0 } }, 'Serving: ', h('code', { text: (S.roots || []).join(', ') || '.' })));
    view.append(n); return;
  }
  if (!S.selected.length) { view.append(emptyNotice('Select one or more runs in the sidebar to compare them.')); return; }
  const fn = { charts: renderCharts, system: renderSystem, tables: renderTables, media: renderMedia, overview: renderOverview, config: (v) => compareTable(v, (d) => d.config, 'No config values.'), summary: (v) => compareTable(v, (d) => d.summary, 'No summary values.'), logs: renderLogs, artifacts: renderArtifacts }[S.tab] || renderCharts;
  const r = fn(view);
  if (r && r.catch) r.catch((e) => view.append(emptyNotice('Error: ' + e.message)));
}
async function loadRuns() {
  const runs = await DS.runs();
  const prev = new Map(S.runs.map((r) => [r.key, r]));
  S.runs = runs;
  S.byKey = new Map(runs.map((r) => [r.key, r]));
  return runs.some((r) => !prev.has(r.key) || prev.get(r.key).state !== r.state || prev.get(r.key).name !== r.name) || prev.size !== runs.length;
}
let tick = 0, polling = false;
async function poll() {
  if (!S.live || polling || document.hidden) return;
  polling = true;
  try {
    tick++;
    let listChanged = false;
    if (tick % 3 === 0) { listChanged = await loadRuns(); if (listChanged) renderSidebar(); }
    let changed = false;
    for (const k of S.selected) {
      const r = S.byKey.get(k);
      if (!r || (r.state !== 'running' && runData(k).loaded && tick % 6 !== 0)) continue;
      if (await refreshRun(k)) changed = true;
    }
    if (changed) {
      if (S.tab === 'charts' || S.tab === 'system') {
        const before = panels.size; const want = S.tab === 'charts' ? chartMetrics().length : null;
        if (want !== null && want !== before) renderView(); else invalidateAll();
      } else if (S.tab === 'summary' || S.tab === 'overview') renderView();
      else if (S.tab === 'tables' && S.table.idx === null) renderView();
      else if (S.tab === 'media') renderView();
    }
    if (changed && S.tab === 'logs') renderView();
  } catch (e) { console.warn(e); } finally { polling = false; }
}
function applyTheme() {
  const root = document.documentElement;
  if (S.theme === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', S.theme);
  const btn = $('#themeBtn'); btn.replaceChildren(svgIcon(S.theme === 'dark' ? ICON.moon : S.theme === 'light' ? ICON.sun : ICON.auto, 18)); btn.title = 'Theme: ' + S.theme;
  CSSV = null; invalidateAll();
}
async function main() {
  renderTabs();
  applyTheme();
  $('#themeBtn').addEventListener('click', () => { S.theme = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; store.set('theme', S.theme); applyTheme(); });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { CSSV = null; invalidateAll(); });
  $('#runsToggle').addEventListener('click', () => document.body.classList.toggle('sidebar-open'));
  const live = $('#liveToggle');
  if (!DS.live) { $('#liveWrap').style.display = 'none'; $('#exportBtn').style.display = 'none'; }
  live.checked = S.live;
  live.addEventListener('change', () => { S.live = live.checked; store.set('live', S.live); });
  $('#exportBtn').addEventListener('click', () => { if (!S.selected.length) { toast('Select runs to export first.'); return; } window.location.href = 'api/report?keys=' + S.selected.map(enc).join(','); });
  let st = 0;
  $('#runSearch').addEventListener('input', (e) => { clearTimeout(st); st = setTimeout(() => { S.runFilter = e.target.value; renderSidebar(); }, 150); });
  $('#projectSelect').addEventListener('change', (e) => { S.project = e.target.value; store.set('project', S.project); renderSidebar(); });
  $('#selLatest').addEventListener('click', () => { const r = filteredRuns()[0]; if (r) setSelection([r.key]); });
  $('#selVisible').addEventListener('click', () => { const rs = filteredRuns(); if (rs.length > MAX_SEL) toast(`Selected the ${MAX_SEL} most recent of ${rs.length} visible runs.`); setSelection(rs.slice(0, MAX_SEL).map((r) => r.key)); });
  $('#selNone').addEventListener('click', () => setSelection([]));
  try {
    if (!EMBED) { const r = await getJSON('api/runs'); S.roots = r.roots; S.runs = r.runs; S.byKey = new Map(r.runs.map((x) => [x.key, x])); }
    else await loadRuns();
  } catch (e) { $('#view').replaceChildren(emptyNotice('Could not reach the wandb-local server: ' + e.message)); return; }
  $('#brandSub').textContent = EMBED ? 'report' : `${S.runs.length} run(s)`;
  let sel = (store.get('selected', []) || []).filter((k) => S.byKey.has(k));
  if (EMBED) sel = S.runs.map((r) => r.key);
  if (!sel.length && S.runs.length) sel = [S.runs[0].key];
  setSelection(sel);
  setInterval(poll, 5000);
}
main();
